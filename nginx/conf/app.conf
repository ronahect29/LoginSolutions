# ======================================================
# HTTP LOCAL
# ======================================================

server {
    listen 80;

    server_name login.solutions.local;

    return 301 https://$host$request_uri;
}


# ======================================================
# HTTPS LOCAL
# ======================================================

server {
    listen 443 ssl;

    http2 on;

    server_name login.solutions.local;

    ssl_certificate
        /etc/ssl/login.solutions.local.pem;

    ssl_certificate_key
        /etc/ssl/login.solutions.local-key.pem;


    # ======================================================
    # MARCAJES WEB
    # ======================================================

    location /marcajes/ {
        proxy_pass http://marcajes-web:5173;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host login.solutions.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    # ======================================================
    # ADMIN WEB
    # ======================================================

    location /admin/ {
        proxy_pass http://admin-web:5174;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host login.solutions.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    # ======================================================
    # USER SERVICE API
    # ======================================================

    location /user-service/api/ {
        proxy_pass http://user-service:4000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    # ======================================================
    # MARCAJES API
    # ======================================================

    location /marcajes-api/api/ {
        proxy_pass http://marcajes-api:4100/marcajes-api/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}


# ======================================================
# ACCESO EXTERNO
# VS CODE DEV TUNNEL
# ======================================================

server {
    listen 8080;

    server_name _;
    absolute_redirect off;
    port_in_redirect off;


    # ======================================================
    # RAÍZ
    # ======================================================

    location = / {
        return 302 /marcajes/;
    }


    # ======================================================
    # MARCAJES WEB
    # ======================================================

    location /marcajes/ {
        proxy_pass http://marcajes-web:5173;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host marcajes-web;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
